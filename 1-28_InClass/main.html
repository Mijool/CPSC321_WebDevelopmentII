<body>
    <section class="row form-group col-12" style="width: 90%; margin: auto;">
      <div id="dropDownLeft" class="col-6">

        <div class="form-check">

          </label>
        </div>
      </div>

      <div id="dropDownRight" class="col-6" >

          <option value="">None</option>
          <option value="">Option1</option>
          <option value="">Option2</option>
          <option value="">Option3</option>
        </select>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="rightEnable">
          <label class="form-check-label" for="">
            Enable
          </label>
        </div>
      </div>
    </section>
</body>
