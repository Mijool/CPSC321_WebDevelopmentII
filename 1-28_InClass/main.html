<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Miguel Camarena - CPSC 321 WebDev2</title>
        <!--bootstrap 5.3.8 linked here-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script><!--custom css linked here-->
        <!-- custom style sheet -->
        <link href="./styles.css" rel="stylesheet"/>
    </head>
<body>
  <!-- main container I put everything in -->
   <!-- row prop to lay elements next to each other           makes everything centered and not stuck on the edges -->
    <section class="row form-group col-12" style="width: 90%; margin: auto;">

      <!-- left side of the page -->
      <div id="dropDownLeft" class="col-6">
        <h1>Entry Left</h1>
        <label for="leftDropdownResult">Leftside</label>
        <!-- bootstrap dropdown class -->
        <select class="form-select" id="leftDropdownResult">
          <option value="">None</option>
          <option value="">Option1</option>
          <option value="">Option2</option>
          <option value="">Option3</option>
        </select>
        <!-- bootstrap checkbox is created here -->
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="leftEnable" checked>
          <label class="form-check-label" for="leftEnable">
            Enable
          </label>
        </div>
      </div>

      <!-- same as the left -->
      <div id="dropDownRight" class="col-6" >
        <h1>Entry Right</h1>
        <label for="rightDropdownResult">Rightside</label>
        <select class="form-select" id="rightDropdownResult" disabled>
          <option value="">None</option>
          <option value="">Option1</option>
          <option value="">Option2</option>
          <option value="">Option3</option>
        </select>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="rightEnable">
          <label class="form-check-label" for="rightEnable">
            Enable
          </label>
        </div>
      </div>
    </section>
</body>

<!--always place scripts AFTER body tag-->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  $(document).ready(function(){
    $("#leftEnable").change(function(){
      //dynammically activates and disables elements based on whether the checkbox is enabled, makes sure that one checkbox is always checked
      var checkedState = $("#leftEnable").is(':checked');
      //if left side is checked enabled, left side dropdown gets enabled
      $("#leftDropdownResult").prop('disabled', !checkedState);

      $("#rightDropdownResult").val(""); //both sides cleared for assurance
      $("#leftDropdownResult").val("");
      //turns off opposite side
      $("#rightDropdownResult").prop('disabled', checkedState);
      $("#rightEnable").prop('checked', !checkedState);
    })
    $("#rightEnable").change(function(){ //inverse of the last handler
      var checkedState = $("#rightEnable").is(':checked');
      $("#rightDropdownResult").prop('disabled', !checkedState);
      $("#rightDropdownResult").val("");
      $("#leftDropdownResult").val("");
      $("#leftDropdownResult").prop('disabled', checkedState);
      $("#leftEnable").prop('checked', !checkedState);
    })
  })

</script>

</html>
